name: git-carpet
description: Weave a Persian carpet from a GitHub account's activity, as an animated SVG for a profile README.
author: AlirezaAzadbakht
branding:
  icon: grid
  color: red

inputs:
  user:
    description: Account whose carpet to weave. Defaults to the repository owner.
    default: ''
  output-dir:
    description: Folder, relative to the workspace, that receives carpet.svg.
    default: carpet
  commit:
    description: Commit and push carpet.svg when it changes ("true" or "false").
    default: 'true'
  commit-message:
    description: Message for that commit.
    default: "carpet: weave the day's carpet"
  github-token:
    description: Token for reading public account data; the built-in token is enough.
    default: ${{ github.token }}

runs:
  using: node20
  main: src/action.js
